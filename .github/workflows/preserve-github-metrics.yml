name: Preserve GitHub metrics

on:
  schedule:
    - cron: "23 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preserve-github-metrics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTEXT_TRAFFIC_TOKEN: ${{ github.token }}
      METRICS_COMMIT_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Load the capture script without cloning the repository
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $API_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/scripts/capture-github-metrics.mjs?ref=$GITHUB_SHA" \
            | jq --raw-output '.content' \
            | base64 --decode > "$RUNNER_TEMP/capture-github-metrics.mjs"

      - name: Preserve the aggregate snapshot
        run: node "$RUNNER_TEMP/capture-github-metrics.mjs" --commit
